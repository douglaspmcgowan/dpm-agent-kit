<!doctype html>
<html lang="en" data-theme="tokyo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dpm-agent-kit — control panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ===== shared theme tokens (whole-site toggle target) ===== */
      :root,
      [data-theme="tokyo"] {
        --bg: #15161e;
        --panel: #1b1d29;
        --panel2: #191b25;
        --side: #14151c;
        --text: #c8d0f0;
        --muted: #6b73a0;
        --line: #262a40;
        --accent: #9ece6a;
        --accent2: #7aa2f7;
        --cyan: #7dcfff;
        --magenta: #bb9af7;
        --danger: #f7768e;
        --warn: #e0af68;
        --disp: "Sora", system-ui, sans-serif;
        --body-font: "IBM Plex Sans", system-ui, sans-serif;
        --mono:
          "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
        --r: 6px;
      }
      [data-theme="brutalist"] {
        --bg: #fafafa;
        --panel: #ffffff;
        --panel2: #f2f2f2;
        --side: #0d0d0d;
        --text: #0d0d0d;
        --muted: #5a5a5a;
        --line: #0d0d0d;
        --accent: #c81e00;
        --accent2: #0d0d0d;
        --cyan: #0a58ff;
        --magenta: #7a3cff;
        --danger: #c81e00;
        --warn: #9a5a00;
        --disp: "Space Mono", monospace;
        --mono: "Space Mono", monospace;
        --body-font: "Space Mono", monospace;
        --r: 0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--body-font);
        font-size: 14px;
        line-height: 1.6;
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
      }
      /* ---- top bar (shared chrome) ---- */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 12px 24px;
        border-bottom: 1px solid var(--line);
        background: var(--panel2);
      }
      .topbar a.back {
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
      }
      .topbar a.back:hover {
        color: var(--accent);
      }
      .xnav {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }
      .xnav a {
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
      }
      .xnav a:hover,
      .xnav a.on {
        color: var(--accent);
      }
      .theme-pill {
        display: flex;
        align-items: center;
        gap: 7px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 12px;
        color: var(--text);
        cursor: pointer;
      }
      .theme-pill:hover {
        border-color: var(--accent);
      }
      .theme-pill:focus-visible {
        outline: none;
        box-shadow:
          0 0 0 2px var(--bg),
          0 0 0 3px var(--accent);
      }
      .theme-pill .sw {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--accent);
      }
      /* ---- sidebar + main grid (below the topbar) ---- */
      .shell {
        display: grid;
        grid-template-columns: 248px 1fr;
        min-height: 0;
      }
      nav {
        background: var(--side);
        border-right: 1px solid var(--line);
        padding: 24px 14px;
        overflow-y: auto;
        color: var(--text);
      }
      /* brutalist: the sidebar block stays dark, so re-scope it to light-on-dark text */
      [data-theme="brutalist"] nav {
        --text: #e8e8e8;
        --muted: #9aa0b5;
        --accent: #ff5a3c;
        --line: #3a3a3a;
      }
      nav .brand {
        font-family: var(--disp);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
        padding: 0 8px 16px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 14px;
      }
      nav .brand .g {
        color: var(--accent);
      }
      nav .grp {
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--muted);
        margin: 18px 8px 8px;
      }
      nav button {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        text-align: left;
        background: transparent;
        border: 1px solid transparent;
        color: var(--text);
        font-family: var(--mono);
        font-size: 13px;
        padding: 9px 10px;
        border-radius: var(--r);
        cursor: pointer;
        transition: 0.15s;
      }
      nav button:hover {
        background: var(--panel);
      }
      nav button.on {
        background: var(--panel);
        border: 1px solid var(--line);
      }
      nav button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      nav button .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: 0 0 auto;
      }
      main {
        padding: 34px 40px;
        overflow-y: auto;
      }
      .head h2 {
        font-family: var(--disp);
        font-size: 27px;
        font-weight: 800;
        letter-spacing: -0.015em;
        margin: 0;
      }
      .head .tag {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin: 10px 0 0;
      }
      .head p {
        color: var(--text);
        opacity: 0.82;
        max-width: 720px;
        margin: 14px 0 0;
      }
      .stats {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin: 26px 0 30px;
      }
      .stat {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 14px 18px;
        min-width: 118px;
      }
      .stat .v {
        font-family: var(--disp);
        font-size: 24px;
        font-weight: 700;
        color: var(--accent);
        line-height: 1.1;
      }
      .stat .l {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 14px;
      }
      .item {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r);
        overflow: hidden;
        transition: border-color 0.15s;
      }
      .item:hover {
        border-color: var(--accent);
      }
      .item:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .item .row {
        padding: 14px 16px;
        cursor: pointer;
        user-select: none;
      }
      .item .it {
        font-family: var(--disp);
        font-weight: 600;
        font-size: 14px;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .item .it .b {
        font-family: var(--mono);
        font-weight: 500;
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 20px;
        border: 1px solid var(--line);
        color: var(--muted);
        letter-spacing: 0.5px;
      }
      .item .it .b.block {
        color: var(--danger);
        border-color: var(--danger);
      }
      .item .it .b.warn {
        color: var(--warn);
        border-color: var(--warn);
      }
      .item .it .b.flow {
        color: var(--cyan);
        border-color: var(--cyan);
      }
      .item .it .b.gen {
        color: var(--accent);
        border-color: var(--accent);
      }
      .item .it .caret {
        margin-left: auto;
        color: var(--muted);
        transition:
          transform 0.2s,
          color 0.2s;
        font-size: 15px;
      }
      .item.open .it .caret {
        transform: rotate(90deg);
        color: var(--accent);
      }
      .item .d {
        color: var(--text);
        opacity: 0.82;
        font-size: 13px;
        margin-top: 7px;
      }
      .item .body {
        display: grid;
        grid-template-rows: 0fr;
        overflow: hidden;
        transition: grid-template-rows 0.28s ease;
      }
      .item.open .body {
        grid-template-rows: 1fr;
      }
      .item .body .inner {
        min-height: 0;
        padding: 0 16px 16px;
        border-top: 1px solid var(--line);
        margin-top: 2px;
      }
      .item .body .inner p {
        margin: 12px 0 0;
        color: var(--text);
        opacity: 0.82;
        font-size: 13px;
      }
      .item .body .inner code {
        color: var(--cyan);
        background: var(--bg);
        padding: 1px 6px;
        border-radius: 5px;
        font-size: 12px;
      }
      .item .body .inner .src {
        margin-top: 14px;
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.3px;
      }
      .showmore {
        margin-top: 14px;
      }
      .showmore button {
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        padding: 8px 16px;
        border-radius: var(--r);
        cursor: pointer;
      }
      .showmore button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .showmore button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .extbox {
        margin-top: 26px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 18px 20px;
      }
      .extbox h3 {
        font-family: var(--disp);
        font-size: 14px;
        margin: 0 0 10px;
        letter-spacing: 0.3px;
      }
      .extbox p {
        margin: 0 0 12px;
        color: var(--text);
        opacity: 0.82;
        font-size: 13px;
      }
      .extbox p:last-child {
        margin-bottom: 0;
      }
      .extbox code {
        color: var(--cyan);
        background: var(--bg);
        padding: 2px 8px;
        border-radius: 5px;
        font-size: 13px;
      }
      .extbtns {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }
      .extbtn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--bg);
        border: 1px solid var(--accent);
        border-radius: var(--r);
        padding: 9px 16px;
        color: var(--accent);
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
      }
      .extbtn:hover {
        background: var(--accent);
        color: var(--bg);
      }
      .extbtn.sub {
        border-color: var(--line);
        color: var(--muted);
      }
      .extbtn.sub:hover {
        background: var(--panel2);
        color: var(--text);
      }
      .extbtn:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 2px;
      }
      .demo {
        background: var(--panel2);
        border: 1px dashed var(--line);
        border-radius: var(--r);
        padding: 16px 18px;
        margin-top: 24px;
        white-space: pre-wrap;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.7;
      }
      .demo .err {
        color: var(--danger);
      }
      .demo .ok {
        color: var(--accent);
      }
      .demo .key {
        color: var(--cyan);
      }
      @media (max-width: 760px) {
        .shell {
          grid-template-columns: 1fr;
        }
        nav {
          border-right: none;
          border-bottom: 1px solid var(--line);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <a class="back" href="index.html">← intro</a>
      <nav class="xnav">
        <a href="option-2-scrollytelling.html">walkthrough</a
        ><a href="option-1-node-map.html">map</a
        ><a href="option-3-terminal.html">terminal</a
        ><a class="on" href="option-4-dashboard.html">panel</a>
        ><a href="skills-library.html">library</a
        ><a href="harness-map.html">harness</a>
      </nav>
      <button class="theme-pill" id="themeBtn" title="switch theme">
        <span class="sw"></span><span id="theme-label">tokyo</span>
      </button>
    </div>
    <div class="shell">
      <nav>
        <div class="brand">dpm-agent-kit <span class="g">▴</span></div>
        <div class="grp">Pillars</div>
        <div id="nav-pillars"></div>
        <div class="grp">Plugged-in tools</div>
        <div id="nav-tools"></div>
      </nav>
      <main id="main"></main>
    </div>
    <script>
      /* ---------- theme toggle (cycle THEMES, persist to localStorage, pill shows name) ---------- */
      const THEMES = ["tokyo", "brutalist"];
      let ti = Math.max(
        0,
        THEMES.indexOf(localStorage.getItem("dpmkit-theme")),
      );
      function applyTheme() {
        document.documentElement.dataset.theme = THEMES[ti];
        localStorage.setItem("dpmkit-theme", THEMES[ti]);
        const l = document.getElementById("theme-label");
        if (l) l.textContent = THEMES[ti];
      }
      document.getElementById("themeBtn").onclick = () => {
        ti = (ti + 1) % THEMES.length;
        applyTheme();
      };
      applyTheme();

      /* ---------- sections (preserved data + per-item expand bodies) ----------
   each item: [name, badge, short-desc, {body, src}]  — body matches the kit's reference detail content
   sections may set initial:N to collapse a long list behind a "show all" toggle. */
      const V = {
        accent: "var(--accent)",
        cyan: "var(--cyan)",
        green: "var(--accent)",
        magenta: "var(--magenta)",
        blue: "var(--accent2)",
        yellow: "var(--warn)",
        red: "var(--danger)",
      };
      const SECTIONS = {
        skills: {
          nav: "Skills",
          color: V.magenta,
          group: "pillar",
          tag: "reusable expertise",
          desc: "A skill is a markdown file with a name and a one-line description; the description is what triggers it. The agent reads your request, notices a skill that fits, and pulls in that expertise on its own — or you type /name to call it directly. The kit layers three sets: the superpowers framework, grill-me, and your own custom skills. They compose: brainstorm a design, plan it, execute it, verify it.",
          stats: [
            ["35", "skills total"],
            ["14", "superpowers"],
            ["19", "your custom"],
          ],
          initial: 8,
          items: [
            [
              "using-superpowers",
              "gen",
              "Dispatcher — routes your request to the right skills in order.",
              {
                body: `<p>The entry point to the superpowers framework. It reads what you asked for and reaches for the right phase on its own, so you do not have to remember which of the ~14 skills fits.</p><p>Think of it as a switchboard: one skill that hands work to <code>brainstorming</code>, then planning, then execution, then verification.</p>`,
                src: "github.com/obra/superpowers",
              },
            ],
            [
              "brainstorming",
              "gen",
              "Design-first dialogue; hard-gates code until you approve a design.",
              {
                body: `<p>The flagship of the superpowers framework. It opens a design conversation and will not write any code until you have approved a direction.</p><p>That gate is the point: it forces the "what are we actually building" question before a single line gets typed, so you catch the holes early.</p>`,
                src: "github.com/obra/superpowers",
              },
            ],
            [
              "grill-me",
              "flow",
              "Relentless one-question-at-a-time interrogation of your plan.",
              {
                body: `<p>Relentless, one-question-at-a-time interrogation of a plan. It walks the whole decision tree, resolving dependencies one by one, and gives a recommended answer with each question.</p><p>Reach for it when an idea is still fuzzy and you want the holes found before any code gets written.</p>`,
                src: "a custom skill in the kit",
              },
            ],
            [
              "test-driven-development",
              "gen",
              "Red-green-refactor: failing test first, then minimum code.",
              {
                body: `<p>Walks the classic red-green-refactor loop: write a failing test, write the minimum code to pass it, then clean up. The test comes first so the code has something to answer to.</p><p>It keeps the agent honest about what "done" means, since the bar is a passing test you can read.</p>`,
                src: "github.com/obra/superpowers",
              },
            ],
            [
              "systematic-debugging",
              "gen",
              "Root-cause before any fix; kills shotgun debugging.",
              {
                body: `<p>Forces a root-cause pass before any fix lands. The agent forms a hypothesis, confirms it, and only then changes code.</p><p>It exists to kill shotgun debugging, where you change five things at once and never learn which one mattered.</p>`,
                src: "github.com/obra/superpowers",
              },
            ],
            [
              "writing-plans",
              "gen",
              "Turn a spec into a step-by-step implementation plan.",
              {
                body: `<p>Takes a spec or set of requirements and writes a step-by-step implementation plan before any code is touched. The plan becomes the thing you review and the worker executes.</p><p>Pairs with <code>executing-plans</code>: one writes the map, the other follows it with checkpoints.</p>`,
                src: "github.com/obra/superpowers",
              },
            ],
            [
              "executing-plans",
              "gen",
              "Run a written plan in a fresh session with review checkpoints.",
              {
                body: `<p>Executes a written implementation plan in a separate session, pausing at review checkpoints so you can confirm each phase landed before the next starts.</p><p>It is how a long build survives context limits: the plan is the memory, the session just works the next step.</p>`,
                src: "github.com/obra/superpowers",
              },
            ],
            [
              "verification-before-completion",
              "gen",
              'No "it works" until a command proves it. Evidence before claims.',
              {
                body: `<p>Before the agent says a thing is fixed, done, or passing, this makes it run the actual verification command and show you the output. Evidence first, claim second.</p><p>It is the antidote to the agent cheerfully reporting success on something it never ran.</p>`,
                src: "github.com/obra/superpowers",
              },
            ],
            [
              "requesting-code-review",
              "gen",
              "Ask for a structured review before merging a change.",
              {
                body: `<p>Bundles a finished change into a structured review request, so the work gets checked against the original requirements before it merges.</p>`,
                src: "github.com/obra/superpowers",
              },
            ],
            [
              "receiving-code-review",
              "gen",
              "Take review feedback with rigor, not performative agreement.",
              {
                body: `<p>How to take review feedback: verify each suggestion technically before implementing it, push back on the questionable ones, and skip the reflexive "great catch!" agreement.</p>`,
                src: "github.com/obra/superpowers",
              },
            ],
            [
              "dispatching-parallel-agents",
              "gen",
              "Fan out 2+ independent tasks to separate workers.",
              {
                body: `<p>When you face two or more tasks with no shared state and no ordering between them, this dispatches them to separate workers at once instead of grinding through them in series.</p>`,
                src: "github.com/obra/superpowers",
              },
            ],
            [
              "subagent-driven-development",
              "gen",
              "Execute plan tasks as sub-agents inside the current session.",
              {
                body: `<p>Runs the independent tasks of a plan as sub-agents within your current session, so the main thread stays the coordinator and the workers do the legwork.</p>`,
                src: "github.com/obra/superpowers",
              },
            ],
            [
              "using-git-worktrees",
              "gen",
              "Isolate feature work in its own checkout before you start.",
              {
                body: `<p>Sets up an isolated workspace (a git worktree, or a native equivalent) so feature work does not collide with whatever is in your main checkout.</p><p>It is the "don't break the thing you're standing on" step before a big change.</p>`,
                src: "github.com/obra/superpowers",
              },
            ],
            [
              "finishing-a-development-branch",
              "gen",
              "Decide how to integrate finished work: merge, PR, or clean up.",
              {
                body: `<p>When the implementation is done and the tests pass, this lays out the integration options — merge, open a pull request, or tear the branch down — so the close-out is deliberate.</p>`,
                src: "github.com/obra/superpowers",
              },
            ],
            [
              "writing-skills",
              "gen",
              "Author and pressure-test a new skill so it actually triggers.",
              {
                body: `<p>Helps you write a new skill and pressure-test its description, since the description is the trigger and a vague one never fires.</p><p>This is the skill you use to grow the rest of the set.</p>`,
                src: "github.com/obra/superpowers",
              },
            ],
            [
              "deep-search",
              "gen",
              "Multi-step web research with fan-out + inline citations.",
              {
                body: `<p>Multi-step web research with fan-out and inline citations. It plans sub-questions, dispatches parallel searches, leans on human practitioner sources (Reddit, HN, recognized blogs), and brings back a sourced synthesis instead of a single-shot answer.</p>`,
                src: "a custom skill in the kit",
              },
            ],
            [
              "make-playbook",
              "gen",
              "Capture a reusable pattern after a task.",
              {
                body: `<p>After you finish a task worth repeating, this captures it as a reusable playbook so the next run is faster. The way the setup compounds: when you re-explain a workflow, you turn it into a skill.</p>`,
                src: "a custom skill in the kit",
              },
            ],
            [
              "parallelize",
              "gen",
              "Decompose work into parallel sub-agent dispatches.",
              {
                body: `<p>Decomposes work into independent parts and dispatches them as parallel sub-agents in one message. Guard rails: 3+ genuinely independent parts, no two workers writing the same file.</p>`,
                src: "a custom skill in the kit",
              },
            ],
            [
              "rollover",
              "flow",
              "End-of-session handoff: write CURRENT-TASK.md and seed memory.",
              {
                body: `<p>The end-of-session ritual as a skill: gather diagnostics, write a clean baton-pass into CURRENT-TASK.md, and seed memory with the session's lessons so tomorrow boots clean.</p>`,
                src: "a custom skill in the kit",
              },
            ],
            [
              "build-tracker",
              "gen",
              "Generate a deadline/application tracker (calendar, cards, table, iCal).",
              {
                body: `<p>Builds a personal deadline tracker from a reference implementation: calendar, cards, table, and map views, plus an iCal export and local notes. Point it at a new domain (fellowships, jobs, conferences) and it adapts.</p>`,
                src: "a custom skill in the kit",
              },
            ],
            [

          desc: "A Windows-native terminal multiplexer built for AI agents. It splits one window into panes, each running its own agent (Claude Code, Codex, Gemini) over a shared repo. The agents can message each other, and a browser-automation MCP toolset (mcp__wmux__*) lets them drive a browser. It is how you run a small team of agents side by side instead of one at a time.",
          stats: [
            ["N", "agents in panes"],
            ["A2A", "messaging"],
            ["mcp__wmux__", "tools"],
          ],
          items: [],
          ext: {
            intro: `<p>Think of it as splitting your terminal into rooms, each with its own agent working the same codebase. One pane implements while another reviews; a message-passing layer lets them coordinate ("I changed the schema, re-run your tests") without you relaying by hand.</p><p>There is no marketing site to link; install it from the command line.</p>`,
            install: "winget install openwong2kim.wmux",
          },
          demo: '┌ pane 1: claude ─┬ pane 2: codex ─┐\n│ implementing... │ reviewing...   │\n└─────────────────┴────────────────┘\n<span class="key">a2a_task_send</span> <span class="ok">→ agents coordinate over one repo.</span>',
        },
        globalcfg: {
          nav: "global-config",
          color: V.magenta,
          group: "tool",
          tag: "~/.claude as a repo",
          desc: "Your entire ~/.claude directory kept as a portable git repo — the source of truth for how the agent behaves across every machine you use. Clone it onto a new laptop and your whole agent comes with you: contract, hooks, skills, settings. A .gitignore keeps secrets and transcripts out. This kit is its public, scrubbed, explained sibling.",
          stats: [
            ["1", "source of truth"],
            ["git", "versioned"],
            ["gitignore", "secrets out"],
          ],
          items: [],
          demo: '<span class="key">git clone …/claude-global-config ~/.claude</span>\n<span class="ok">→ your whole agent reproduced on a new machine.</span>',
        },
        dpmsites: {
          nav: "dpm-sites hub",
          color: V.magenta,
          group: "tool",
          tag: "profile + site index",
          desc: "A personal landing/index page plus a profile knowledge base (bio, stories, signature numbers) that any agent reads before it writes about you — the anti-fabrication backstop. When outreach or portfolio copy pulls from one factual source, the numbers stop getting invented. A blank skeleton ships in templates/profile/ for you to fill in.",
          stats: [
            ["1", "hub page"],
            ["8", "profile files"],
            ["0", "fabricated facts"],
          ],
          items: [],
          demo: '<span class="key">read profile/signature-numbers.md before drafting</span>\n<span class="ok">→ every number cited has a source; none invented.</span>',
        },
      };
      const main = document.getElementById("main");
      const BADGE = {
        block: "blocks",
        warn: "warns",
        flow: "workflow",
        gen: "general",
      };

      function render(key) {
        const s = SECTIONS[key];
        document
          .querySelectorAll("nav button")
          .forEach((b) => b.classList.toggle("on", b.dataset.k === key));
        let html = `<div class="head"><h2 style="color:${s.color}">${s.nav}</h2><div class="tag">${s.tag}</div><p>${s.desc}</p></div>`;
        html +=
          '<div class="stats">' +
          s.stats
            .map(
              ([v, l]) =>
                `<div class="stat"><div class="v" style="color:${s.color}">${v}</div><div class="l">${l}</div></div>`,
            )
            .join("") +
          "</div>";
        if (s.items.length) {
          const collapsible = s.initial && s.items.length > s.initial;
          html +=
            '<div class="grid" id="grid">' +
            s.items
              .map(([t, b, d, more], i) => {
                const badge = b
                  ? `<span class="b ${b}">${BADGE[b] || b}</span>`
                  : "";
                const expandable = more && more.body;
                const bodyHtml = expandable
                  ? `<div class="body" id="body-${i}"><div class="inner">${more.body}${more.src ? `<div class="src">source · ${more.src}</div>` : ""}</div></div>`
                  : "";
                const caret = expandable ? '<span class="caret">›</span>' : "";
                const attrs = expandable
                  ? `tabindex="0" role="button" aria-expanded="false" aria-controls="body-${i}" data-i="${i}"`
                  : "";
                const hidden =
                  collapsible && i >= s.initial ? ' data-extra="1"' : "";
                return `<div class="item${expandable ? " expandable" : ""}"${hidden} ${attrs}><div class="row"><div class="it">${t}${badge}${caret}</div><div class="d">${d}</div></div>${bodyHtml}</div>`;
              })
              .join("") +
            "</div>";
          if (collapsible) {
            html += `<div class="showmore"><button id="showMoreBtn" tabindex="0">show all ${s.items.length} ›</button></div>`;
          }
        }
        if (s.ext) {
          html += renderExt(s.ext);
        }
        if (s.demo) {
          html += `<div class="demo">${s.demo}</div>`;
        }
        main.innerHTML = html;
        main.scrollTop = 0;
        wireItems();
        wireShowMore(s);
      }
      function renderExt(e) {
        let h = '<div class="extbox">';
        if (e.links || e.install) {
          h += '<div class="extbtns">';
          (e.links || []).forEach(([label, url, sub], i) => {
            h += `<a class="extbtn${i > 0 ? " sub" : ""}" href="${url}" target="_blank" rel="noopener">${label}<span style="opacity:.7;font-weight:400">${sub}</span></a>`;
          });
          h += "</div>";
        }
        if (e.intro) {
          h += e.intro;
        }
        if (e.install) {
          h += `<p>Install from the terminal: <code>${e.install}</code></p>`;
        }
        if (e.doc) {
          h += `<p class="src" style="margin-top:14px;font-size:11px;color:var(--muted)">more · ${e.doc}</p>`;
        }
        h += "</div>";
        return h;
      }
      function toggleItem(el) {
        const open = el.classList.toggle("open");
        el.setAttribute("aria-expanded", open ? "true" : "false");
      }
      function wireItems() {
        main.querySelectorAll(".item.expandable").forEach((el) => {
          el.addEventListener("click", () => toggleItem(el));
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              toggleItem(el);
            } else if (e.key === "Escape") {
              if (el.classList.contains("open")) {
                el.classList.remove("open");
                el.setAttribute("aria-expanded", "false");
              }
            }
          });
        });
      }
      function wireShowMore(s) {
        const btn = document.getElementById("showMoreBtn");
        if (!btn) return;
        let shown = false;
        const apply = () => {
          main.querySelectorAll(".item[data-extra]").forEach((el) => {
            el.style.display = shown ? "" : "none";
          });
          btn.textContent = shown
            ? "show less ‹"
            : `show all ${s.items.length} ›`;
        };
        apply();
        btn.addEventListener("click", () => {
          shown = !shown;
          apply();
        });
      }
      /* global Escape: collapse any open tile */
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          main.querySelectorAll(".item.open").forEach((el) => {
            el.classList.remove("open");
            el.setAttribute("aria-expanded", "false");
          });
        }
      });
      function buildNav() {
        const p = document.getElementById("nav-pillars"),
          t = document.getElementById("nav-tools");
        Object.entries(SECTIONS).forEach(([k, s]) => {
          const b = document.createElement("button");
          b.dataset.k = k;
          b.innerHTML = `<span class="dot" style="background:${s.color}"></span>${s.nav}`;
          b.onclick = () => render(k);
          (s.group === "pillar" ? p : t).appendChild(b);
        });
      }
      buildNav();
      render("skills");
    </script>
  </body>
</html>
